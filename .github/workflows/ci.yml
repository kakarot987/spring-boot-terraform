name: Local Spring Boot CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: localuser
          POSTGRES_PASSWORD: localpass
          POSTGRES_DB: tododb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localuser -d tododb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package against PostgreSQL
        run: chmod +x gradlew && ./gradlew --no-daemon clean test bootJar
      - name: Build application container
        run: docker build -t spring-boot-todo:ci .
