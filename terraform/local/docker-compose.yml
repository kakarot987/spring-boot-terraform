version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: localuser
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"

  app:
    build: ../../app
    environment:
      - SPRING_PROFILES_ACTIVE=local
    ports:
      - "8080:8080"
    depends_on:
      - postgres
