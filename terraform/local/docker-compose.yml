services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: localuser
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: tododb
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localuser -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
